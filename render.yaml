services:
  - type: web
    name: tg7-error-md-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: WORK_MODE
        value: public
      - key: BOT_NAME
        value: TG7 ERROR MD
      - key: PREFIX
        value: "."
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
